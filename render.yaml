services:
  - type: web
    name: careloop-api
    runtime: python
    rootDir: apps/api
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careloop-db
          property: connectionString
      - key: ENVIRONMENT
        value: staging
      - key: OSCAR_ISS_BASE
        sync: false
      - key: OSCAR_CLIENT_ID
        sync: false
      - key: OSCAR_CLIENT_SECRET
        sync: false
      - key: REDIRECT_URI
        value: https://careloop-api.onrender.com/auth/callback
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false

  - type: cron
    name: careloop-lab-ingestion
    runtime: python
    rootDir: apps/api
    plan: starter
    schedule: "0 10 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.jobs.lab_ingestion
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careloop-db
          property: connectionString
      - key: OSCAR_ISS_BASE
        sync: false
      - key: OSCAR_CLIENT_ID
        sync: false
      - key: OSCAR_CLIENT_SECRET
        sync: false

  - type: web
    name: careloop-design-system
    runtime: static
    rootDir: apps/design-system
    buildCommand: npm ci && npm run build
    staticPublishPath: dist

  - type: web
    name: careloop-patient-web
    runtime: static
    rootDir: apps/patient-web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist

  - type: web
    name: careloop-clinician-dashboard
    runtime: static
    rootDir: apps/clinician-dashboard
    buildCommand: npm ci && npm run build
    staticPublishPath: dist

databases:
  - name: careloop-db
    plan: free
    databaseName: careloop
    user: careloop
